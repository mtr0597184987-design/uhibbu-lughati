<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1D2B53"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>أحب لغتي بالواقع المعزز</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* التخطيط: عمود واحد للجوال، بطاقات لعب سميكة الحواف، شريط علوي ثابت وتذييل ثابت باسم المُعِدّة */
:root{--ink:#1D2B53;--ink2:#52608A;--sea:#0FA3B1;--sea-d:#0B7A86;--sun:#FFC53D;--red:#D7263D;--leaf:#2BA84A;--sand:#FFF4DC;--paper:#FFFFFF;--sky:#DFF4FA;--line:#D5E3EE;--ok:#1E9E57;--bad:#D7263D;--warn:#F28A2E;
--ui:'Baloo Bhaijaan 2','Noto Naskh Arabic',Tahoma,sans-serif;--rd:'Noto Naskh Arabic','Baloo Bhaijaan 2','Traditional Arabic',serif}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky),var(--sand)) fixed;color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.9;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:74px 76px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{position:fixed;top:0;inset-inline:0;z-index:20;background:var(--paper);border-bottom:3px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.ib{width:46px;height:46px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.pill{background:var(--sun);border-radius:999px;padding:0 12px;font-weight:800;display:flex;gap:4px;align-items:center;height:38px;flex:none}
.foot{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--ink);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);letter-spacing:.2px}
.foot b{color:var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 20px;border-radius:16px;background:var(--sea);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--sea-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sea-d)}
.btn.y{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #D69A12}.btn.r{background:var(--red);box-shadow:0 5px 0 #9E1626}.btn.g{background:var(--leaf);box-shadow:0 5px 0 #1C7A33}
.btn.w{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px;border-radius:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.c{justify-content:center}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border-radius:22px;padding:16px;border:3px solid var(--line)}
h2{font-size:22px;margin:0;line-height:1.6;text-wrap:balance}h3{font-size:18px;margin:0}
.mut{color:var(--ink2);font-size:15px}
.rd{font-family:var(--rd);font-size:26px;line-height:2.35}
.hero{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.hero svg{width:96px}
.say{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 14px;position:relative;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lc{text-align:start;background:var(--paper);border-radius:22px;border:3px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--line)}
.lc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.lc svg{display:block;width:100%;aspect-ratio:4/3}
.lc .b{padding:8px 14px 12px}.lc .n{font-weight:800;font-size:20px}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf);border-radius:9px}
.stg{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--paper);border-radius:20px;border:3px solid var(--line);padding:10px 12px;width:100%;box-shadow:0 5px 0 var(--line)}
.stg .no{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800}
.stg b{font-size:19px;display:block;line-height:1.5}
.tick{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;font-weight:800}.tick.on{background:var(--ok)}
.scn{position:relative;border-radius:22px;overflow:hidden;border:4px solid var(--paper);box-shadow:0 0 0 3px var(--line);background:#cfeaf5;max-width:100%}
.scn svg{display:block;width:100%;aspect-ratio:4/3}
.hot{cursor:pointer}.hot circle.r{fill:#fff;fill-opacity:.28;stroke:#fff;stroke-width:3;animation:pulse 1.6s infinite;transform-box:fill-box;transform-origin:center}
.hot circle.d{fill:var(--sun);stroke:var(--ink);stroke-width:2}.hot.seen circle.d{fill:var(--leaf)}.hot.tgt circle.r{stroke:var(--sun);stroke-width:5}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.25);opacity:0}}
.drift{animation:drift 9s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(26px)}}
.bob{animation:bob 2.6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px) rotate(-2deg)}}
.sway{animation:sway 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.shake{animation:shk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes shk{from{transform:rotate(-14deg)}to{transform:rotate(12deg) translateY(6px)}}
.swim{animation:swim 3s ease-in-out infinite alternate}@keyframes swim{to{transform:translateX(-22px)}}
.bounce{animation:bnc .7s ease-in-out infinite alternate}@keyframes bnc{to{transform:translateY(-14px)}}
.rock{animation:rock 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes rock{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.twk{animation:twk 1.8s ease-in-out infinite alternate}@keyframes twk{to{opacity:.45}}
.wave{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(18px)}}
.gust{animation:gust 2.2s ease-in-out infinite}@keyframes gust{0%{transform:translateX(-14px);opacity:.2}50%{opacity:1}100%{transform:translateX(22px);opacity:.2}}
.orbit{animation:orb 14s linear infinite;transform-origin:200px 196px}@keyframes orb{to{transform:rotate(-360deg)}}
.sink{animation:sink 2.4s ease-in-out infinite alternate}@keyframes sink{to{transform:translateY(8px)}}
.beat{animation:beat .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes beat{to{transform:scale(1.25)}}
.flag{animation:twk 1s infinite alternate}
.scn.win svg{animation:win .9s}@keyframes win{30%{transform:scale(1.04)}60%{transform:scale(.99)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pop{background:var(--paper);border:3px solid var(--sun);border-radius:20px;padding:12px 14px}
.pop .w{font-family:var(--rd);font-size:34px;font-weight:700;line-height:1.9;color:var(--sea-d)}
.opt{display:block;width:100%;text-align:start;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 14px;font-family:var(--rd);font-size:22px;line-height:2.1;box-shadow:0 4px 0 var(--line)}
.opt.ok{border-color:var(--ok);background:#E5F7EC}.opt.no{border-color:var(--bad);background:#FDE7EA;animation:nope .3s}
.opt.sel{border-color:var(--sea);background:#E2F6F8}.opt.done{opacity:.4;pointer-events:none}
@keyframes nope{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:50px;min-width:54px;padding:0 14px;background:var(--paper);border:3px solid var(--sea);border-radius:14px;font-family:var(--rd);font-size:24px;line-height:2;box-shadow:0 4px 0 var(--sea-d)}
.chip.used{opacity:.25;pointer-events:none}.chip.no{border-color:var(--bad);animation:nope .3s}
.slot{display:inline-block;min-width:78px;border-bottom:4px dashed var(--sea);text-align:center;color:var(--ok);font-weight:700}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--sea)}.dots i.ok{background:var(--ok)}
.mound{aspect-ratio:1;border-radius:50% 50% 18px 18px;background:radial-gradient(circle at 40% 30%,#F7DFA5,#D9A94F);border:3px solid #C9973A;display:grid;place-items:center;font-family:var(--rd);font-size:21px;font-weight:700;padding:4px;line-height:1.7;text-align:center}
.mound.open{background:var(--paper);border-color:var(--sea);border-radius:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.face{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:6px;font-weight:800;box-shadow:0 4px 0 var(--line)}.face svg{width:64px;height:64px}
.path{display:flex;align-items:center;justify-content:space-between;gap:2px;direction:rtl}.path span{width:38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}.path span.on{background:var(--warn)}.path span.ok{background:var(--ok)}.path i{flex:1;height:6px;background:var(--line);border-radius:3px}
.txt span.wd{border-radius:8px;padding:0 3px;cursor:pointer}.txt .ok{background:#CFF2DD;color:#0E5B30}.txt .bad{background:#FBD3D8;color:#96111F}.txt .rev{background:#FFE2BF;color:#8A4A05}.txt .cur{outline:3px solid var(--sun)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-weight:700}.kv b{font-variant-numeric:tabular-nums;color:var(--sea-d)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tabs button{flex:none;padding:4px 14px;border-radius:999px;background:var(--paper);border:3px solid var(--line);font-weight:800;min-height:44px}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid var(--line);padding:4px 8px;text-align:start;white-space:nowrap}th{background:var(--sky)}td{font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=password]{font:inherit;font-family:var(--rd);font-size:20px;width:100%;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--paper);color:var(--ink);line-height:2.1}
.modal{position:fixed;inset:0;z-index:40;background:rgba(29,43,83,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.modal>.card{width:min(680px,100%);max-height:100%;overflow:auto}
.ar{position:fixed;inset:0;z-index:50;background:#000;touch-action:none;overflow:hidden}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .obj{position:absolute;left:50%;top:50%;width:min(92vw,520px);touch-action:none}
.ar .obj svg{display:block;width:100%;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.ar .hud{position:absolute;inset-inline:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;align-items:center}
.ar .tip{background:rgba(255,255,255,.94);border-radius:16px;padding:4px 14px;font-weight:700;text-align:center;max-width:560px}
.ar .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:12px}
.toast{position:fixed;inset-inline:16px;bottom:64px;z-index:60;margin:auto;max-width:520px;background:var(--ink);color:#fff;border-radius:16px;padding:8px 16px;text-align:center;font-weight:700}
.stars{color:var(--sun);font-size:30px;letter-spacing:4px;text-shadow:0 2px 0 #D69A12}
.bdg{display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px 12px}.bdg.off{opacity:.4}.bdg i{font-style:normal;width:48px;height:48px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:24px;flex:none}
.thumb{width:120px;flex:none;border-radius:14px;overflow:hidden;border:3px solid var(--line)}.thumb svg{display:block;width:100%}
.note{background:#FFF3C4;border:2px dashed #E0A800;border-radius:14px;padding:6px 12px;font-size:15px;font-weight:700}
.rec{color:var(--red);font-weight:800;animation:twk .7s infinite alternate}
@media (min-width:720px){.rd{font-size:30px}.split{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}}
</style>
<div id="defs"></div>
<div class="top" dir="rtl"><button class="ib" id="bk" aria-label="رجوع" hidden>›</button><h1 id="ttl">أُحِبُّ لُغَتِي</h1><span class="pill" id="st" hidden>★ <span id="stn">٠</span></span><button class="ib" id="who" aria-label="تبديل الطالب" hidden></button></div>
<main id="app" dir="rtl" lang="ar"></main>
<div class="foot" dir="rtl">إعداد: <b>فاطمة بنت سالم بن حسن البلوشي</b></div>
<script>
/* ===== الرسوم: مكتبة عناصر كرتونية مرسومة بالمتجهات، لوحة 400×300 ===== */
const G=(x,y,s,inner,cls)=>`<g transform="translate(${x} ${y}) scale(${s})">${cls?`<g class="${cls}">${inner}</g>`:inner}</g>`;
const DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EC4F0"/><stop offset="1" stop-color="#D8F3FB"/></linearGradient>
<linearGradient id="g-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3F8F"/><stop offset=".55" stop-color="#F28A5B"/><stop offset="1" stop-color="#FFD58A"/></linearGradient>
<linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141B4D"/><stop offset="1" stop-color="#3A4A9A"/></linearGradient>
<linearGradient id="g-storm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C8BA6"/><stop offset="1" stop-color="#D5DDE8"/></linearGradient>
<linearGradient id="g-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E9FC4"/><stop offset="1" stop-color="#6FD6D9"/></linearGradient>
<linearGradient id="g-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FE0E6"/><stop offset="1" stop-color="#1B6FA8"/></linearGradient>
<linearGradient id="g-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DFA5"/><stop offset="1" stop-color="#E3B96B"/></linearGradient>
<linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9773B"/><stop offset="1" stop-color="#7A4A22"/></linearGradient>
<linearGradient id="g-clay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D98B52"/><stop offset=".5" stop-color="#EBA76E"/><stop offset="1" stop-color="#A9612F"/></linearGradient>
<linearGradient id="g-grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD857"/><stop offset="1" stop-color="#3FA34D"/></linearGradient>
<linearGradient id="g-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1D6"/><stop offset="1" stop-color="#F3D9A8"/></linearGradient>
<linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A066"/><stop offset="1" stop-color="#B57A44"/></linearGradient>
<radialGradient id="g-sun"><stop offset="0" stop-color="#FFF6B0"/><stop offset="1" stop-color="#FFB72B"/></radialGradient>
<radialGradient id="g-glow"><stop offset="0" stop-color="#FFE98A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE98A" stop-opacity="0"/></radialGradient>
</defs></svg>`;
const S={
sky:(k='day')=>`<rect width="400" height="300" fill="url(#g-${k})"/>`,
sun:(x,y,r=20)=>`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="url(#g-glow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#g-sun)"/>`,
moon:(x,y)=>`<circle cx="${x}" cy="${y}" r="26" fill="url(#g-glow)"/><circle cx="${x}" cy="${y}" r="13" fill="#FFF7CF"/><circle cx="${x+5}" cy="${y-3}" r="11" fill="#2A357F" opacity=".55"/>`,
stars:(n=10,sd=3)=>{let o='';for(let i=0;i<n;i++){const x=(i*97*sd+31)%390+5,y=(i*53*sd+17)%110+6;o+=`<circle class="twk" style="animation-delay:${i*.3}s" cx="${x}" cy="${y}" r="${1+i%2}" fill="#FFF7CF"/>`}return o},
cloud:(x,y,s=1,c='#fff')=>G(x,y,s,`<ellipse cx="0" cy="2" rx="28" ry="10" fill="${c}"/><ellipse cx="-13" cy="-5" rx="14" ry="11" fill="${c}"/><ellipse cx="8" cy="-9" rx="17" ry="13" fill="${c}"/>`,'drift'),
sea:(y,h=80,g='g-sea')=>`<rect x="0" y="${y}" width="400" height="${h}" fill="url(#${g})"/>`+[0,1,2].map(i=>`<path class="wave" style="animation-delay:${i*.7}s" d="M${20+i*120},${y+14+i*16} q10,-6 20,0 t20,0 t20,0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>`).join(''),
sand:(y)=>`<path d="M0,${y+8} q60,-14 130,-4 t140,-2 t130,2 V300 H0z" fill="url(#g-sand)"/>`,
dune:(x,y,w,c='#E9C27A')=>`<path d="M${x},${y} q${w/2},${-w/3} ${w},0z" fill="${c}"/>`,
hills:(y)=>`<path d="M230,${y} l25,-22 18,10 22,-26 26,20 20,-10 34,18 25,-6 V${y}z" fill="#C9B79A"/><rect x="290" y="${y-40}" width="9" height="14" fill="#E9DDC6"/><path d="M288,${y-40} h13 l-2,-4 h-9z" fill="#B79F7E"/>`,
grass:(y)=>`<path d="M0,${y+6} q100,-16 200,-4 t200,-2 V300 H0z" fill="url(#g-grass)"/>`,
flowers:(y,n=9)=>{let o='';const c=['#FF5D73','#FFD23F','#fff','#B388EB','#FF9F1C'];for(let i=0;i<n;i++){const x=18+i*(364/(n-1)),yy=y+(i*37)%22;o+=`<line x1="${x}" y1="${yy}" x2="${x}" y2="${yy+12}" stroke="#2E7D32" stroke-width="2"/><circle cx="${x}" cy="${yy}" r="5" fill="${c[i%5]}"/><circle cx="${x}" cy="${yy}" r="2" fill="#FFB300"/>`}return o},
palm:(x,y,s=1)=>G(x,y,s,`<path d="M0,0 q-10,-50 6,-96" stroke="#8A5A2B" stroke-width="9" fill="none" stroke-linecap="round"/>`+[-70,-35,0,35,70,-110,110].map(a=>`<path transform="translate(6 -96) rotate(${a})" d="M0,0 q22,-18 50,-4 q-26,-2 -50,4z" fill="#2E9E4F"/>`).join('')+`<circle cx="4" cy="-92" r="4" fill="#7A4A22"/><circle cx="10" cy="-90" r="4" fill="#7A4A22"/>`,'sway'),

function assess(L,redo){T('أُقَيِّمُ تَقَدُّمِي');const P=LP(L.id);
  if(P.quiz&&!redo)return report(L);const qs=shuf(L.scenes.map(s=>s.q)).slice(0,4);let score=0,i=0;
  const SELF=['اِسْتَمْتَعْتُ بِهَذَا الدَّرْسِ.','أَشْعُرُ أَنَّ قِرَاءَتِي تَتَحَسَّنُ.','أُرِيدُ أَنْ أَقْرَأَ نُصُوصًا أُخْرَى.'],ans=[];
  const self=k=>{if(k>=SELF.length){P.quiz={score,total:qs.length,at:Date.now()};P.self=ans;setStage(L,5);chrome();return report(L)}
    app.innerHTML=`<div class="col"><div class="card col"><div class="mut">رَأْيِي فِي تَعَلُّمِي · ${n(k+1)} مِنْ ${n(3)}</div><div class="rd" style="font-weight:700">${SELF[k]}</div><div class="mut">هَذَا رَأْيُكَ أَنْتَ، وَلَا يُؤَثِّرُ فِي نُجُومِكَ.</div></div><div class="g3">${[['نَعَمْ','h','#B7E4C7',2],['قَلِيلًا','w','#FFE8A3',1],['لَا','s','#FFC9C9',0]].map(f=>`<button class="face" data-v="${f[3]}">${faceSVG(f[1],f[2])}<span>${f[0]}</span></button>`).join('')}</div></div>`;
    $$('.face').forEach(b=>b.onclick=()=>{ans.push(+b.dataset.v);beep(1);self(k+1)})};
  const step=()=>{if(i>=qs.length)return self(0);let first=true;app.innerHTML=`<div class="col"><div class="dots">${qs.map((_,k)=>`<i class="${k<i?'ok':k===i?'on':''}"></i>`).join('')}</div><div class="card col" id="mq"><div class="mut">السُّؤَالُ ${n(i+1)} مِنْ ${n(qs.length)}</div>${mcqHTML(qs[i])}</div></div>`;
    bindMcq($('#mq'),()=>{if(first)score++;i++;setTimeout(step,800)},()=>first=false)};step()}

    body=`<div class="card col"><h3>متوسط إتقان المهارات (من ٣ نجوم)</h3><div class="tw"><table><tr><th>المهارة</th><th>المتوسط</th><th>عدد النتائج</th></tr>${Object.entries(SK).map(([k,v])=>`<tr><td>${v}</td><td>${sk[k]?n((sk[k][0]/sk[k][1]).toFixed(1)):'—'}</td><td>${sk[k]?n(sk[k][1]):'٠'}</td></tr>`).join('')}</table></div></div>
    <div class="card col"><h3>جدول الربط: اللعبة ← المهارة ← مؤشر الأداء ← طريقة القياس</h3><div class="tw"><table><tr><th>الدرس</th><th>اللعبة / النشاط</th><th>المهارة</th><th>مؤشر الأداء</th><th>طريقة القياس</th><th>المشهد المرتبط</th></tr>${LESSONS.map(L=>L.games.map(g=>`<tr><td>${n(L.id)}</td><td>${g.n}</td><td>${SK[g.sk]}</td><td>${g.ind}</td><td>${g.ty==='recite'?'إتمام الإنشاد ودقة المطابقة الصوتية':g.ty==='opinion'?'أخطاء الاستنتاج + تسجيل الرأي':'النجوم، عدد الأخطاء، المحاولات، الزمن'}</td><td>${L.scenes[g.sc].t}</td></tr>`).join('')+`<tr><td>${n(L.id)}</td><td>المشاهد الستة</td><td>${SK.c} + ${SK.d}</td><td>يقرأ كلمات المشهد وجمله ويجيب عن مهمته</td><td>إنجاز المهمة + دقة القراءة الصوتية للجملة</td><td>—</td></tr><tr><td>${n(L.id)}</td><td>أقرأ بطلاقة</td><td>${SK.f}</td><td>يقرأ بدقة وسرعة مناسبة</td><td>الدقة٪، كلمة/دقيقة، المحذوف والمضاف والمكرر</td><td>—</td></tr>`).join('')}</table></div></div>`}
  if(tab==='ct')body=`<div class="card col"><h3>نصوص الدروس الأصلية</h3><div class="mut">ألصقي نص كل درس مشكولًا كما في الكتاب. في النصوص الشعرية اجعلي كل بيت في سطر. بعد الحفظ تُبنى منه القراءة المتدرجة وألعاب الإكمال وبناء الجمل والإنشاد والحفظ تلقائيًا. الحفظ هنا يخص هذا الجهاز؛ ولإيصال النصوص إلى أجهزة الطلبة كلها نزّلي ملف content.json وضعيه بجوار ملف المنصة على الاستضافة.</div></div>${LESSONS.map(L=>`<div class="card col"><label for="c${L.id}"><b>${n(L.id)}. ${L.t}</b> <span class="mut">ص ${L.pages}${L.own?' · لا نص له في الكتاب؛ النص هنا يستبدل قصة المنصة في القراءة فقط':''}</span></label><textarea id="c${L.id}" rows="5">${esc(DB.content[L.id]||SITE[L.id]||'')}</textarea><div class="mut" id="w${L.id}"></div></div>`).join('')}<div class="row c"><button class="btn g" id="csv">حفظ النصوص</button><button class="btn" id="cdl">تنزيل content.json</button></div>`;
  if(tab==='rc')body='<div class="card col" id="rcl"><h3>تسجيلات القراءة المحفوظة على هذا الجهاز</h3><div class="mut">تُحفظ عند تعذّر التصحيح الآلي فقط، ولا تُرسل إلى أي مكان.</div></div>';
  if(tab==='dt')body=`<div class="card col"><h3>تصدير البيانات</h3><div class="mut">ملف CSV يفتح في Excel: نتائج الألعاب والمشاهد والقراءة والتقويم لكل طالب على هذا الجهاز.</div><button class="btn g" id="ex">تصدير CSV</button></div><div class="card col"><h3>الرقم السري</h3><input type="text" id="np" inputmode="numeric" value="${esc(DB.pin)}"><button class="btn sm" id="sp" style="align-self:start">حفظ الرقم</button></div><div class="card col"><h3>حذف بيانات هذا الجهاز</h3><button class="btn r sm" id="del" style="align-self:start">حذف كل بيانات الطلبة</button></div>`;
  app.innerHTML=`<div class="col"><div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>${body}</div>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{stack[stack.length-1][1][0]=b.dataset.t;draw()});
  $$('[data-d]').forEach(b=>b.onclick=()=>{const m=DB.st[b.dataset.d];modal(`<h3>${esc(m.name)}</h3>${LESSONS.map(L=>{const P=LP(L.id,m);return `<b style="color:${L.c}">${L.t} · ${n(lessonPct(L,m))}٪</b><div class="tw"><table><tr><th>النشاط</th><th>النجوم</th><th>الأخطاء</th><th>المحاولات</th><th>الزمن</th></tr>${L.games.map((g,k)=>{const r=P.games[k];return `<tr><td>${g.n}</td><td>${r?n(r.best):'—'}</td><td>${r?n(r.err):'—'}</td><td>${r?n(r.tries):'—'}</td><td>${r?n(r.sec)+' ث':'—'}</td></tr>`}).join('')}${P.reads.map(r=>`<tr><td>قراءة: ${levels(L)[r.lv][0]}</td><td>${n(r.st)}</td><td>دقة ${n(r.acc)}٪</td><td>${n(r.wpm)} ك/د</td><td>${n(r.dur)} ث</td></tr>`).join('')}</table></div>`}).join('')}<button class="btn w" data-x>إغلاق</button>`)});
  if(tab==='ct'){$('#csv').onclick=()=>{LESSONS.forEach(L=>{const v=$('#c'+L.id).value.trim();if(v)DB.content[L.id]=v;else delete DB.content[L.id];$('#w'+L.id).textContent=v?`حُفظ: ${n(wordsOf(v).length)} كلمة${/[ً-ْ]/.test(v)?'':' — تنبيه: النص بلا حركات'}`:''});save();toast('حُفظت النصوص على هذا الجهاز.')};
    $('#cdl').onclick=()=>{const o={};LESSONS.forEach(L=>{const v=$('#c'+L.id).value.trim();if(v)o[L.id]=v});saveFile('content.json',JSON.stringify(o,null,1),'application/json')}}
  if(tab==='rc')recAll().then(a=>{const box=$('#rcl');if(!box)return;if(!a.length){box.insertAdjacentHTML('beforeend','<div>لا توجد تسجيلات.</div>');return}a.sort((x,y)=>y.at-x.at).forEach(r=>{const d=el(`<div class="col" style="gap:2px;border-top:2px solid var(--line);padding-top:8px"><b>${esc(r.name)} · ${Lof(r.lesson).t} · ${levels(Lof(r.lesson))[r.lv][0]} · ${n(r.dur)} ث</b><audio controls style="width:100%"></audio></div>`);$('audio',d).src=URL.createObjectURL(r.blob);box.append(d)})});
  if(tab==='dt'){$('#ex').onclick=()=>saveFile('reading-results.csv',csv());$('#sp').onclick=()=>{const v=$('#np').value.trim();if(v){DB.pin=v;save();toast('حُفظ الرقم السري.')}};let arm=false;$('#del').onclick=()=>{if(!arm){arm=true;$('#del').textContent='اضغط مرة ثانية لتأكيد الحذف';return}DB.st={};DB.cur=null;save();try{indexedDB.deleteDatabase(KEY)}catch(e){}stack=[[login,[]]];draw()}}}

stack=[[me()?home:login,[]]];draw();
</script>
</body></html>
